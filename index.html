<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Shop - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-700 font-sans">
  <!-- Header -->
  <header class="bg-pink-200 p-4 shadow-md flex justify-between items-center">
    <h1 class="text-2xl font-bold text-pink-700">🌸 Cute Shop</h1>
    <nav>
      <a href="index.html" class="mx-2 hover:underline">Home</a>
      <a href="products.html" class="mx-2 hover:underline">Products</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="text-center py-12">
    <h2 class="text-4xl font-bold text-pink-700 mb-4">Welcome to Cute Shop!</h2>
    <p class="text-lg">We bring you adorable and handcrafted goodies 💕</p>
  </section>

  <!-- Contact Form -->
  <section class="max-w-lg mx-auto bg-white shadow-lg rounded-2xl p-6 mb-12">
    <h3 class="text-2xl font-semibold text-center text-pink-600 mb-4">Contact Us</h3>
    <form class="space-y-4">
      <input type="text" placeholder="Your Name" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400">
      <input type="email" placeholder="Your Email" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400">
      <textarea placeholder="Your Message" rows="4" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
      <button type="submit" class="w-full bg-pink-500 text-white py-2 rounded-xl hover:bg-pink-600">Send</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="bg-pink-200 text-center p-4">
    <p class="text-sm text-pink-800">© 2025 Cute Shop. All rights reserved.</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Shop - Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-700 font-sans">
  <!-- Header -->
  <header class="bg-pink-200 p-4 shadow-md flex justify-between items-center">
